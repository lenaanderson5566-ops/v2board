name: Quality and dependency security

on:
  push:
    branches: [master, main, codex/payment-icon-picker]
  pull_request:
    branches: [master, main, codex/payment-icon-picker]
  workflow_dispatch:
  # GitHub schedules run from the default branch after this workflow is merged.
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  dependency-audit:
    name: Locked dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit all locked Composer packages
        run: composer audit --locked --abandoned=fail --no-interaction
      - name: Audit production Composer packages
        if: ${{ !cancelled() }}
        run: composer audit --locked --no-dev --abandoned=fail --no-interaction
      - name: Audit all locked npm packages
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --package-lock-only --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org
      - name: Audit production npm packages
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --package-lock-only --omit=dev --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org

  contracts:
    name: Generated V10 contracts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/generate-v10.py --check
      - run: python3 -m unittest discover -s scripts -p test_generate_v10.py

  frontend:
    name: Frontend tests and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm test -- --maxWorkers=4 --testTimeout=20000
      - run: npm run build
      - name: Pass this build to backend resource checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-build
          path: public/console
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Backend critical regressions
    needs: frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ci_bootstrap
          MYSQL_ROOT_PASSWORD: disposable_ci_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable_ci_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      TEST_DISPOSABLE_WORKSPACE: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ci_bootstrap
      DB_USERNAME: root
      DB_PASSWORD: disposable_ci_password
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_DRIVER: array
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, mbstring, pcntl, pdo_mysql, posix, redis, simplexml, sodium, xml, xmlwriter, zip
          ini-values: date.timezone=UTC, memory_limit=512M
          tools: composer:2.10.3
          coverage: none
      - name: Remove the previously tracked frontend build
        run: rm -rf public/console
      - name: Download this workflow's frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-build
          path: public/console
      - name: Prepare disposable application configuration
        run: |
          for private_config in .env config/fastai.php config/v2board.php; do
            if git cat-file -e "HEAD:$private_config" 2>/dev/null; then
              printf 'Release must not track private configuration: %s\n' "$private_config" >&2
              exit 1
            fi
          done
          git cat-file -e HEAD:config/entrypoint-signing.php
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/test-organization bootstrap/cache
          printf '# Disposable CI workspace\n' > .env
          printf '<?php return [];\n' > config/fastai.php
          rm -f resources/rules/custom.*
          ci_app_key="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          printf '::add-mask::%s\n' "$ci_app_key"
          printf 'APP_KEY=%s\n' "$ci_app_key" >> "$GITHUB_ENV"
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: php tests/run.php --validate
      - name: Run existing critical modules
        env:
          NAIVE_CLIENT_FIXTURE: storage/app/test-organization/ci-naive-client-fixture.json
        run: php tests/run.php --only=admin-diagnostics,admin-payment-diagnostics,api-route-audit,api-v10,auth-security,backend-security,browser-session,cache-prefix-upgrade,client-access-unified,commerce,commerce-concurrency,commission-transfer-concurrency,console-smoke,console-verify,credit-expiry,fastai-client-config,fastai-entrypoints,fastai-entrypoint-check,framework-upgrade,lightsail,mfa-api,mfa,naive,node-v10,notification-delivery,paytaro-qr-settlement,product-mail,protocol-compatibility,registration-policy,session-concurrency,subscription-client-policy,timezone-scheduler,timezones,traffic-credits,update-script,usage-resets,phpunit-unit --results=storage/app/test-organization/ci-backend-results.json
      - name: Run existing V2Box deployment workflow
        env:
          V2BOX_BOOTSTRAP_TEST: '1'
        run: |
          for tool in bash python3 jq openssl flock timeout curl unzip sha256sum install; do
            command -v "$tool" >/dev/null
          done
          php tests/run.php --only=v2box --results=storage/app/test-organization/ci-v2box-deployment-results.json
      - name: Verify a real production dependency installation
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
          php tests/run.php --only=framework-upgrade,console-verify --results=storage/app/test-organization/ci-production-results.json
      - name: Preserve synthetic Naive interoperability fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naive-client-fixture
          path: storage/app/test-organization/ci-naive-client-fixture.json
          if-no-files-found: error
          retention-days: 3
